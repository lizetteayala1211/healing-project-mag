<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Healing Project Magazine</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter+Tight:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="/assets/css/styles.css" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/logo/HP_logo_circle_bl.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./assets/logo/HP_logo_circle_bl.png">

    <!-- Apple / iOS -->
    <link rel="apple-touch-icon" href="./assets/logo/HP_logo_circle_bl.png">

    <script src="/assets/js/script.js"></script>
    <script type="module" src="/assets/js/app.js"></script>

</head>

<body class="thp-frame">
    <!-- HOME BAR -->
    <header class="home-bar">
        <div class="home-bar-inner">
            <!-- <a class="logo" href="#/home">The Healing Project Magazine</a> -->
            <a class="logo" href="#/home" aria-label="The Healing Project Magazine">
                <span class="logo-line logo-line1">The Healing</span>
                <span class="logo-line logo-line2">Project Magazine</span>
            </a>


            <button class="hamburger" id="menu-button" aria-label="Open menu">
                <span></span><span></span><span></span>
            </button>
        </div>
    </header>

    <!-- OVERALL LAYOUT -->
    <div class="layout-container">
        <div class="shell">

            <div class="page-grid">
                <!-- LEFT GUTTER = LEDGER -->
                <div class="left-rail" id="side-rail"></div>

                <!-- CENTER = CONTENT -->
                <main class="main">
                    <div class="page" id="app"></div>
                </main>
            </div>

            <!-- MOBILE DRAWER stays separate -->
            <div class="drawer" id="mobile-drawer">
                <div class="drawer-back" id="drawer-backdrop"></div>
                <div class="drawer-panel">
                    <div id="side-rail-mobile"></div>
                </div>
            </div>

        </div>
    </div>
    <!-- MAIN -->
    <main class="main">
        <div class="page" id="app"></div>
    </main>
    </div>
    </div>

    <!-- (ROTATING) FOOTER QUOTE -->
    <footer class="quote">
        <div class="quote-inner">
            <div class="ticker" id="ticker">
                <span class="ticker-text" id="tickerText"></span>
            </div>
        </div>
    </footer>
</body>

</html>
